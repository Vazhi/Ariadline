name: Rename documentation to Ariadline

on:
  push:
    branches:
      - agent/rename-project-to-ariadline

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename project references and validate documentation
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path('.')
          workflow = Path('.github/workflows/rename-to-ariadline.yml')
          doc_suffixes = {'.md', '.markdown', '.mdx', '.txt'}
          text_suffixes = doc_suffixes | {
              '.yml', '.yaml', '.json', '.toml', '.ini', '.cfg',
              '.py', '.js', '.ts', '.sh', '.csv', '.tsv'
          }

          exact_replacements = [
              ('SLE for Linguistics', 'Ariadline'),
              ('Simplified Linguistic English', 'Ariadline'),
              ('SLE Development', 'Ariadline Development'),
              ('SLE-GE', 'Ariadline-GE'),
              ('Vazhi/simplified-linguistic-english', 'Vazhi/Ariadline'),
              ('simplified-linguistic-english', 'Ariadline'),
          ]

          def rename_project_text(text: str, *, prose: bool) -> str:
              for old, new in exact_replacements:
                  text = text.replace(old, new)
              if prose:
                  # Replace the project acronym in prose, headings, metadata, and
                  # lowercase tags, while preserving stable identifiers such as
                  # SLE-RULE-001 and machine-oriented names with underscores.
                  text = re.sub(r'(?<![A-Za-z0-9_-])SLE(?![A-Za-z0-9_-])', 'Ariadline', text)
                  text = re.sub(r'(?<![A-Za-z0-9_-])sle(?![A-Za-z0-9_-])', 'ariadline', text)
                  text = re.sub(r'\bSLE(?=-[a-z])', 'Ariadline', text)
              return text

          # Rename documentation files so Obsidian note titles match the new name.
          rename_map: dict[str, str] = {}
          doc_files = [
              p for p in root.rglob('*')
              if p.is_file() and '.git' not in p.parts and p.suffix.lower() in doc_suffixes
          ]
          for path in sorted(doc_files, key=lambda p: len(p.parts), reverse=True):
              new_name = rename_project_text(path.name, prose=True)
              if new_name == path.name:
                  continue
              destination = path.with_name(new_name)
              if destination.exists():
                  raise SystemExit(f'rename collision: {path} -> {destination}')
              old_rel = path.as_posix()
              path.rename(destination)
              rename_map[old_rel] = destination.as_posix()

          # Replace project-name references in documentation. In supporting text
          # files, update exact project names and any renamed paths without
          # rewriting stable SLE-* identifiers used by fixtures or tooling.
          candidates = [
              p for p in root.rglob('*')
              if p.is_file() and '.git' not in p.parts and p.suffix.lower() in text_suffixes
          ]
          for path in candidates:
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = rename_project_text(original, prose=path.suffix.lower() in doc_suffixes)
              for old_rel, new_rel in rename_map.items():
                  updated = updated.replace(old_rel, new_rel)
                  updated = updated.replace(Path(old_rel).name, Path(new_rel).name)
                  updated = updated.replace(Path(old_rel).stem, Path(new_rel).stem)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')

          # The migration workflow is temporary and must not remain in the PR.
          if workflow.exists():
              workflow.unlink()

          markdown_files = [
              p for p in root.rglob('*.md')
              if '.git' not in p.parts
          ]

          stale: list[str] = []
          stale_pattern = re.compile(
              r'Simplified Linguistic English|SLE for Linguistics|SLE-GE|'
              r'(?<![A-Za-z0-9_-])SLE(?![A-Za-z0-9_-])|\bSLE(?=-[a-z])'
          )
          for path in markdown_files:
              text = path.read_text(encoding='utf-8')
              if stale_pattern.search(text):
                  stale.append(path.as_posix())
              if stale_pattern.search(path.name):
                  stale.append(f'filename:{path.as_posix()}')
          if stale:
              raise SystemExit('stale project-name references remain:\n' + '\n'.join(sorted(set(stale))))

          # Validate Obsidian links after note renames.
          stems: dict[str, list[str]] = {}
          for path in markdown_files:
              stems.setdefault(path.stem, []).append(path.as_posix())
          duplicates = {stem: paths for stem, paths in stems.items() if len(paths) > 1}
          if duplicates:
              details = '\n'.join(f'{stem}: {paths}' for stem, paths in sorted(duplicates.items()))
              raise SystemExit('duplicate Markdown basenames:\n' + details)

          broken: list[str] = []
          wikilink = re.compile(r'!?\[\[([^\]]+)\]\]')
          for path in markdown_files:
              text = path.read_text(encoding='utf-8')
              for raw in wikilink.findall(text):
                  target = raw.split('|', 1)[0].split('#', 1)[0].strip()
                  if not target:
                      continue
                  target_name = Path(target).name
                  if target_name not in stems:
                      broken.append(f'{path.as_posix()}: [[{raw}]]')
          if broken:
              raise SystemExit('broken Obsidian links after rename:\n' + '\n'.join(broken[:200]))

          print(f'Renamed {len(rename_map)} documentation files.')
          print(f'Validated {len(markdown_files)} Markdown files with no stale project-name references.')
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes were required."
            exit 0
          fi
          git commit -m "rename documentation to Ariadline"
          git push
